name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download 3D model and JS libs
        run: |
          cd app/src/main/assets/www
          curl -sL -o xpeng_p7.glb "https://muse.ai/files/1422056750982536/1833562210985525/pupjh1ckczbcg35pmyqp37lt/2022_xpeng_p7.glb"
          curl -sL -o three.min.js "https://unpkg.com/three@0.147.0/build/three.min.js"
          curl -sL -o OrbitControls.js "https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"
          curl -sL -o GLTFLoader.js "https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"
          ls -lh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPengP7-3D
          path: app/build/outputs/apk/debug/app-debug.apk
