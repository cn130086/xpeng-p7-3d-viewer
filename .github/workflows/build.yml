name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:




jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download 3D model and JS libs
        run: |
          cd app/src/main/assets/www
          curl -sL -o xpeng_p7.glb "https://muse.ai/files/1422056750982536/1833562210985525/pupjh1ckczbcg35pmyqp37lt/2022_xpeng_p7.glb"
          curl -sL -o three.min.js "https://muse.ai/files/1422056750982536/1080832668051281/v784ur9iolpjez31d6b71uno/three.min.js"
          curl -sL -o OrbitControls.js "https://muse.ai/files/1422056750982536/1638752414559457/svnxlsyb00teib6qba3o4cx0/OrbitControls.js"
          curl -sL -o GLTFLoader.js "https://muse.ai/files/1422056750982536/1087968534207277/btqkbnlmvp7khn0dcrcf8deu/GLTFLoader.js"
          ls -lh
          python3 -c "
          import base64
          data = open('xpeng_p7.glb','rb').read()
          b64 = base64.b64encode(data).decode()
          open('model_data.js','w').write('var MODEL_B64=\"' + b64 + '\";')
          print('model_data.js created', len(b64))
          "
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPengP7-3D
          path: app/build/outputs/apk/debug/app-debug.apk
