plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xpeng.viewer'
    compileSdk 31

    defaultConfig {
        applicationId 'com.xpeng.viewer'
        minSdk 24
        targetSdk 31
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.6.0'
}
