<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>XPENG P7 3D 展厅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e14;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; }
  #scene { position:fixed; inset:0; }
  #title { position:fixed; top:calc(20px + env(safe-area-inset-top)); left:0; right:0;
    text-align:center; pointer-events:none; z-index:10; }
  #title h1 { color:#fff; font-size:22px; letter-spacing:8px; font-weight:600;
    text-shadow:0 2px 20px rgba(0,0,0,.6); }
  #title p { color:rgba(255,255,255,.55); font-size:12px; letter-spacing:3px; margin-top:6px; }
  #hint { position:fixed; bottom:calc(28px + env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; color:rgba(255,255,255,.45); font-size:12px; letter-spacing:2px;
    pointer-events:none; z-index:10; animation:fade 3s ease-in-out infinite; }
  @keyframes fade { 0%,100%{opacity:.45} 50%{opacity:1} }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#0a0e14; z-index:20;
    transition:opacity .6s; }
  #loading.hide { opacity:0; pointer-events:none; }
  .spin { width:44px; height:44px; border:3px solid rgba(255,255,255,.15);
    border-top-color:#4da3ff; border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg) } }
  #loading p { color:rgba(255,255,255,.6); margin-top:16px; font-size:13px; letter-spacing:2px; }
  #credit { position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; color:rgba(255,255,255,.28); font-size:10px; z-index:10; pointer-events:none; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="title"><h1>小鹏 P7</h1><p>XPENG P7 &middot; 3D 展厅</p></div>
<div id="hint">左右滑动旋转 &middot; 双指缩放</div>
<div id="credit">3D model: supercarmodels (CC-BY) via Sketchfab</div>
<div id="loading"><div class="spin"></div><p>正在加载车模…</p></div>

<script src="three.min.js"></script>
<script>function b64ToBytes(b64){var tbl='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';var lookup=new Uint8Array(256);for(var i=0;i<64;i++)lookup[tbl.charCodeAt(i)]=i;var len=b64.length,pad=0;if(b64[len-1]==='=')pad++;if(b64[len-2]==='=')pad++;var out=new Uint8Array((len*3/4)-pad),p=0;for(var j=0;j<len;j+=4){var t=(lookup[b64.charCodeAt(j)]<<18)|(lookup[b64.charCodeAt(j+1)]<<12)|(lookup[b64.charCodeAt(j+2)]<<6)|lookup[b64.charCodeAt(j+3)];out[p++]=(t>>16)&255;if(p<out.length)out[p++]=(t>>8)&255;if(p<out.length)out[p++]=t&255;}return out;}</script>
<script src="OrbitControls.js"></script>
<script src="GLTFLoader.js"></script>

<script src="model_data.js"></script>
<script>
(function(){
  var container = document.getElementById('scene');
  var W = window.innerWidth, H = window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();



  // ===== 影棚背景：与地板同色浅青，无缝 =====
  scene.background = new THREE.Color(0x9cc9c9);

  var camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 200);
  camera.position.set(0, 3, 11);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;





  controls.dampingFactor = 0.06;
  controls.minDistance = 4.5;
  controls.maxDistance = 18;
  controls.maxPolarAngle = Math.PI * 0.52;
  controls.enablePan = false;

  // ===== 5秒无操作自动归位 =====
  var homePos = new THREE.Vector3(0, 3, 11);
  var homeTarget = new THREE.Vector3(0, 1, 0);
  var idleTimer = null, returning = false;
  function cancelReturn(){ returning = false; if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }
  function goHomeTick(){
    if (!returning) return;
    camera.position.lerp(homePos, 0.08);
    controls.target.lerp(homeTarget, 0.08);
    if (camera.position.distanceTo(homePos) < 0.05) {
      camera.position.copy(homePos); controls.target.copy(homeTarget); returning = false;
    }
  }
  controls.addEventListener('start', function(){ cancelReturn(); });
  controls.addEventListener('end', function(){ cancelReturn(); idleTimer = setTimeout(function(){ returning = true; }, 5000); });

  // ===== 展厅灯光 =====


  var key = new THREE.SpotLight(0xffffff, 2.5);
  key.position.set(5, 10, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0004;
  scene.add(key);

  var fill = new THREE.DirectionalLight(0xbfd4ff, 1.2);
  fill.position.set(-6, 4, 2);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffffff, 1.5);
  rim.position.set(0, 5, -8);
  scene.add(rim); var amb = new THREE.AmbientLight(0xffffff, 0.7); scene.add(amb); var top = new THREE.DirectionalLight(0xffffff, 0.8); top.position.set(0, 10, 0); scene.add(top);
 

  // 左侧补光 + 环境光


  scene.add(fill);



  // ===== 地面：无缝影棚（纯色+边缘渐隐，不受灯光影响） =====
  var fadeCv = document.createElement('canvas'); fadeCv.width = fadeCv.height = 256;
  var fctx = fadeCv.getContext('2d');
  var rg = fctx.createRadialGradient(128,128,0, 128,128,128);
  rg.addColorStop(0, '#ffffff'); rg.addColorStop(0.55, '#ffffff'); rg.addColorStop(1, '#000000');
  fctx.fillStyle = rg; fctx.fillRect(0,0,256,256);
  var floorGeo = new THREE.CircleGeometry(30, 64);
  var floorMat = new THREE.MeshBasicMaterial({ color: 0x9cc9c9, transparent: true, opacity: 0.6, alphaMap: new THREE.CanvasTexture(fadeCv) });
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.renderOrder = 0;
  scene.add(floor);
  // 阴影层（只显示车影）
  var shadowPlane = new THREE.Mesh(floorGeo, new THREE.ShadowMaterial({ opacity: 0.25 }));
  shadowPlane.rotation.x = -Math.PI/2;
  shadowPlane.position.y = 0.001;
  shadowPlane.receiveShadow = true;
  shadowPlane.renderOrder = 1;
  scene.add(shadowPlane);

  // ===== 加载车模 =====
  document.querySelector('#loading p').textContent = '正在解析车模…';
  try {
    var bytes = b64ToBytes(MODEL_B64);
    MODEL_B64 = null;
    var loader = new THREE.GLTFLoader();
    loader.parse(bytes.buffer, '', function(gltf){
    var car = gltf.scene;
    // 自动归一化：缩放到合适大小并居中
    var box = new THREE.Box3().setFromObject(car);
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    var maxDim = Math.max(size.x, size.y, size.z);
    var scale = 7.6 / maxDim;
    car.scale.setScalar(scale);
    car.position.sub(center.multiplyScalar(scale));
    car.position.y += (size.y * scale / 2);
    car.traverse(function(o){
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      if (o.isMesh && o.material) {
        var mt = o.material; var nm = mt.name || '';
        var isGlass = (nm === 'Bodyshell0041Mtl' || nm === 'Doorpsidef0151Mtl' || nm === 'Doorpsider1Mtl');
        if (/^(Bodyshell|Bonnet|Bumper|Door|Boot|Bagashnik)/.test(nm) && !isGlass) { mt.transparent = false; mt.opacity = 1; mt.depthWrite = true; }
        mt.metalness = 0.9; mt.envMapIntensity = 1.0;
        mt.roughness = 0.25; var cc = mt.color; if (cc && (cc.r + cc.g + cc.b) > 1.0) { cc.set(0xffffff); }
      }
    });
    // ===== 地板镜面反射：翻转克隆车模（实心，靠半透明地板压暗） =====
    var mirror = car.clone(true);
    mirror.scale.y *= -1;
    mirror.position.y *= -1;
    mirror.traverse(function(o){
      if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; }
    });
    scene.add(mirror);
    scene.add(car);
    document.getElementById('loading').classList.add('hide');
    // 入场：缓慢自动旋转一圈后停止
    var autoSpin = true, spinT = 0;
    var spinTimer = setInterval(function(){
      spinT += 0.016;
      if (spinT > 7 || !autoSpin) { clearInterval(spinTimer); controls.autoRotate = false; }
    }, 16);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    renderer.domElement.addEventListener('pointerdown', function(){
      autoSpin = false; controls.autoRotate = false;
    }, { once:true });
    }, function(err){
      document.querySelector('#loading p').textContent = '车模解析失败: ' + (err && err.message ? err.message : JSON.stringify(err)).substring(0, 200);
    });
  } catch(e) {
    document.querySelector('#loading p').textContent = '车模加载失败: ' + e.message;
  }

  function animate(){
    requestAnimationFrame(animate);
    goHomeTick();
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body></html>
</html>
